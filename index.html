<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}
body{
background:#050505;
overflow:hidden;
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}
canvas{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
z-index:-2;
}
.blur{
position:fixed;
width:800px;
height:800px;
border-radius:50%;
background:#7c3aed;
filter:blur(180px);
opacity:.18;
left:50%;
top:50%;
transform:translate(-50%,-50%);
z-index:-1;
animation:pulse 8s infinite alternate;
}
@keyframes pulse{
0%{transform:translate(-50%,-50%) scale(1);}
100%{transform:translate(-50%,-50%) scale(1.25);}
}

.card{
width:560px;           /* увеличил */
padding:60px 50px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.12);
backdrop-filter:blur(24px);
border-radius:32px;
transition: transform 0.1s linear, box-shadow 0.4s;
box-shadow:0 0 70px rgba(124,58,237,.25);
transform-style: preserve-3d;
position: relative;
overflow: hidden;
}
.card::before{
content: '';
position: absolute;
top: -150%;
left: -100%;
width: 40%;
height: 300%;
background: linear-gradient(
    120deg,
    transparent 30%,
    rgba(255,255,255,0.35) 50%,
    transparent 70%
);
transition: all 0.7s ease;
pointer-events: none;
z-index: 2;
}
.card:hover::before{
top: 100%;
left: 120%;
transform: rotate(25deg);
}

.card:hover{
box-shadow:0 0 110px rgba(124,58,237,.5);
}

.avatar{
width:140px;           /* увеличил */
height:140px;
border-radius:50%;
background: url('/home/workdir/attachments/image.png') center/cover;
display:flex;
justify-content:center;
align-items:center;
margin:auto;
margin-bottom:35px;
border:4px solid rgba(255,255,255,0.2);
box-shadow:0 0 30px rgba(124,58,237,.3);
}

h1{
font-size:48px;
text-align:center;
margin-bottom:35px;
letter-spacing:-1px;
}

.links{
display:flex;
flex-direction:column;
gap:18px;
}
.links a{
text-decoration:none;
color:white;
background:rgba(255,255,255,.06);
padding:18px 22px;
border-radius:16px;
display:flex;
justify-content:space-between;
align-items:center;
transition:.35s;
border:1px solid rgba(255,255,255,.1);
font-size:17px;
}
.links a:hover{
background:#7c3aed;
transform:translateX(12px);
box-shadow:0 0 20px rgba(124,58,237,.4);
}
footer{
margin-top:40px;
text-align:center;
color:#666;
font-size:13px;
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="blur"></div>

<div class="card" id="card">
    <div class="avatar"></div>
    <h1>Kirill</h1>
    
    <div class="links">
        <a href="#"><span>GitHub</span><span>→</span></a>
        <a href="#"><span>Telegram</span><span>→</span></a>
        <a href="#"><span>Discord</span><span>→</span></a>
    </div>
    <footer></footer>
</div>

<script>
// Particles
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;
let particles=[];
for(let i=0;i<140;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2.2,
dx:(Math.random()-.5)*0.35,
dy:(Math.random()-.5)*0.35
});
}
function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="rgba(255,255,255,0.9)";
particles.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();
p.x+=p.dx; p.y+=p.dy;
if(p.x<0)p.x=canvas.width; if(p.x>canvas.width)p.x=0;
if(p.y<0)p.y=canvas.height; if(p.y>canvas.height)p.y=0;
});
requestAnimationFrame(animate);
}
animate();
window.onresize=()=>{ canvas.width=innerWidth; canvas.height=innerHeight; };

// 3D Effect
const card = document.getElementById("card");

card.addEventListener("mousemove", (e) => {
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    const rotateX = (y - rect.height / 2) / 14 * -1;
    const rotateY = (x - rect.width / 2) / 14;
    
    card.style.transform = `perspective(1100px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(30px)`;
});

card.addEventListener("mouseleave", () => {
    card.style.transform = `perspective(1100px) rotateX(0deg) rotateY(0deg) translateZ(0px)`;
});
</script>
</body>
</html>
