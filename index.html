<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kirill</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#050505;
overflow:hidden;
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

canvas{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
z-index:-2;
}

.blur{
position:fixed;
width:700px;
height:700px;
border-radius:50%;
background:#7c3aed;
filter:blur(180px);
opacity:.18;
left:50%;
top:50%;
transform:translate(-50%,-50%);
z-index:-1;
animation:pulse 8s infinite alternate;
}

@keyframes pulse{

0%{
transform:translate(-50%,-50%) scale(1);
}

100%{
transform:translate(-50%,-50%) scale(1.3);
}

}

.card{

width:480px;
padding:45px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.1);

backdrop-filter:blur(20px);

border-radius:25px;

transition:.4s;

box-shadow:0 0 60px rgba(124,58,237,.2);

}

.card:hover{

transform:translateY(-8px);

box-shadow:0 0 80px rgba(124,58,237,.35);

}

.avatar{

width:110px;
height:110px;
border-radius:50%;
background:linear-gradient(135deg,#8b5cf6,#3b82f6);
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
font-weight:bold;
margin:auto;
margin-bottom:25px;

}

h1{

font-size:42px;
text-align:center;
margin-bottom:10px;

}

.type{

text-align:center;
color:#a1a1aa;
height:30px;
margin-bottom:35px;
font-size:18px;

}

.links{

display:flex;
flex-direction:column;
gap:15px;

}

.links a{

text-decoration:none;

color:white;

background:rgba(255,255,255,.05);

padding:16px;

border-radius:14px;

display:flex;

justify-content:space-between;

transition:.35s;

border:1px solid rgba(255,255,255,.08);

}

.links a:hover{

background:#7c3aed;

transform:translateX(8px);

}

footer{

margin-top:35px;

text-align:center;

color:#777;

font-size:13px;

}

</style>

</head>
<body>

<canvas id="bg"></canvas>

<div class="blur"></div>

<div class="card">

<div class="avatar">
K
</div>

<h1>Kirill</h1>

<div class="type" id="type"></div>

<div class="links">

<a href="#">
<span>GitHub</span>
<span>→</span>
</a>

<a href="#">
<span>Telegram</span>
<span>→</span>
</a>

<a href="#">
<span>Discord</span>
<span>→</span>
</a>

</div>

<footer>

Designed by Kirill

</footer>

</div>

<script>

const text="Full Stack Developer";

let i=0;

function type(){

if(i<text.length){

document.getElementById("type").innerHTML+=text.charAt(i);

i++;

setTimeout(type,90);

}

}

type();

const canvas=document.getElementById("bg");

const ctx=canvas.getContext("2d");

canvas.width=innerWidth;

canvas.height=innerHeight;

let particles=[];

for(let i=0;i<120;i++){

particles.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

r:Math.random()*2,

dx:(Math.random()-.5)*0.4,

dy:(Math.random()-.5)*0.4

});

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";

particles.forEach(p=>{

ctx.beginPath();

ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

ctx.fill();

p.x+=p.dx;

p.y+=p.dy;

if(p.x<0)p.x=canvas.width;

if(p.x>canvas.width)p.x=0;

if(p.y<0)p.y=canvas.height;

if(p.y>canvas.height)p.y=0;

});

requestAnimationFrame(animate);

}

animate();

window.onresize=()=>{

canvas.width=innerWidth;

canvas.height=innerHeight;

};

const card=document.querySelector(".card");

document.addEventListener("mousemove",e=>{

let x=(e.clientX/window.innerWidth-.5)*20;

let y=(e.clientY/window.innerHeight-.5)*20;

card.style.transform=`rotateY(${x}deg) rotateX(${-y}deg)`;

});

</script>

</body>
</html>
