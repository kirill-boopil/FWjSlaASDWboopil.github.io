<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirill | Личная страница</title>
    
    <!-- Подключение шрифтов и иконок -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        /* Общие стили */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #030306;
            overflow: hidden;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        /* Задний фон */
        canvas {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            opacity: 0.6;
        }

        .blur-sphere {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(59, 130, 246, 0.2));
            filter: blur(120px);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            animation: pulseBg 12s infinite alternate ease-in-out;
        }

        @keyframes pulseBg {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0.8; }
        }

        /* Анимации появления */
        @keyframes avatarEntrance {
            0% { transform: scale(0.4) rotate(-15deg); opacity: 0; filter: blur(10px); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0); }
        }

        @keyframes linkEntrance {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0) rotateX(0); }
            50% { transform: translateY(-15px) rotateX(1deg); }
        }

        /* Карточка */
        .card {
            width: 580px;
            padding: 50px 40px;
            background: rgba(15, 15, 22, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            /* Плавное возвращение */
            transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.4s ease;
            animation: cardFloat 6s infinite ease-in-out;
        }

        .card:hover {
            box-shadow: 0 40px 90px rgba(124, 58, 237, 0.25);
            animation-play-state: paused;
        }

        /* Аватарка */
        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: url('avatar.png') center/cover, #1a1a1a;
            margin: 0 auto 30px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            animation: avatarEntrance 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            position: relative;
            z-index: 5;
        }

        h1 {
            font-size: 48px;
            text-align: center;
            margin-bottom: 40px;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #FFFFFF 0%, #AFAFAF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Сетка ссылок */
        .links-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .link-item {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.05);
            padding: 16px 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            animation: linkEntrance 0.6s ease forwards;
        }

        .link-item i {
            font-size: 20px;
            width: 24px;
            text-align: center;
        }

        /* Индивидуальные стили и свечение кнопок */
        .link-item:hover {
            transform: translateY(-5px) scale(1.02);
            color: #fff;
        }

        .github:hover { background: #333 !important; box-shadow: 0 10px 25px rgba(255, 255, 255, 0.15); }
        .telegram:hover { background: #0088cc !important; box-shadow: 0 10px 25px rgba(0, 136, 204, 0.4); }
        .vk:hover { background: #0077ff !important; box-shadow: 0 10px 25px rgba(0, 119, 255, 0.4); }
        .tiktok:hover { background: #010101 !important; color: #ff0050 !important; box-shadow: 0 10px 25px rgba(255, 0, 80, 0.3); }
        .spotify:hover { background: #1DB954 !important; color: #000 !important; box-shadow: 0 10px 25px rgba(29, 185, 84, 0.4); }
        .yandex:hover { background: #ffcc00 !important; color: #000 !important; box-shadow: 0 10px 25px rgba(255, 204, 0, 0.4); }
        .pinterest:hover { background: #bd081c !important; box-shadow: 0 10px 25px rgba(189, 8, 28, 0.4); }
        .discord:hover { background: #5865F2 !important; box-shadow: 0 10px 25px rgba(88, 101, 242, 0.4); }

        /* Очередность появления кнопок */
        .link-item:nth-child(1) { animation-delay: 0.4s; }
        .link-item:nth-child(2) { animation-delay: 0.5s; }
        .link-item:nth-child(3) { animation-delay: 0.6s; }
        .link-item:nth-child(4) { animation-delay: 0.7s; }
        .link-item:nth-child(5) { animation-delay: 0.8s; }
        .link-item:nth-child(6) { animation-delay: 0.9s; }
        .link-item:nth-child(7) { animation-delay: 1.0s; }
        .link-item:nth-child(8) { animation-delay: 1.1s; }

        /* Адаптив под мобилки */
        @media (max-width: 620px) {
            .card { width: 90%; padding: 30px 20px; }
            .links-grid { grid-template-columns: 1fr; }
            h1 { font-size: 36px; }
        }
    </style>
</head>
<body>

    <canvas id="particlesCanvas"></canvas>
    <div class="blur-sphere"></div>

    <div class="card" id="mainCard">
        <div class="avatar"></div>
        <h1>Kirill</h1>
        
        <div class="links-grid">
            <a href="https://github.com/kirill-boopil" target="_blank" class="link-item github">
                <i class="fa-brands fa-github"></i>
                <span>GitHub</span>
            </a>
            <a href="#" class="https://t.me/flactal">
                <i class="fa-brands fa-telegram"></i>
                <span>Telegram</span>
            </a>
            <a href="#" class="линк ВК">
                <i class="fa-brands fa-vk"></i>
                <span>ВКонтакте</span>
            </a>
            <a href="#" class="https://www.tiktok.com/@prokendol112/video/7508817190636752146?is_from_webapp=1&sender_device=pc">
                <i class="fa-brands fa-tiktok"></i>
                <span>TikTok</span>
            </a>
            <a href="#" class="здеся ссылка">
                <i class="fa-brands fa-spotify"></i>
                <span>Spotify</span>
            </a>
            <a href="#" class="здесь ссылка">
                <i class="fa-brands fa-yandex"></i>
                <span>Яндекс Музыка</span>
            </a>
            <a href="#" class="https://pin.it/4Z7VWYWgp">
                <i class="fa-brands fa-pinterest"></i>
                <span>Pinterest</span>
            </a>
            <a href="#" class="дискард">
                <i class="fa-brands fa-discord"></i>
                <span>Discord</span>
            </a>
        </div>
    </div>

    <script>
        /** ЧАСТИЦЫ НА ФОНЕ **/
        const canvas = document.getElementById("particlesCanvas");
        const ctx = canvas.getContext("2d");
        let particlesArray = [];

        function initParticles() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particlesArray = [];
            for (let i = 0; i < 100; i++) {
                particlesArray.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.1,
                    speedX: (Math.random() - 0.5) * 0.5,
                    speedY: (Math.random() - 0.5) * 0.5
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
            particlesArray.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                p.x += p.speedX;
                p.y += p.speedY;
                if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
            });
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener("resize", initParticles);
        initParticles();
        animateParticles();

        /** ИНТЕРАКТИВ КАРТОЧКИ (3D НАКЛОН) **/
        const card = document.getElementById("mainCard");

        card.addEventListener("mousemove", (e) => {
            const rect = card.getBoundingClientRect();
            // Вычисляем положение курсора относительно центра карточки
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Чувствительность (чем меньше делитель, тем сильнее наклон)
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = (y - centerY) / 12; // Умеренная чувствительность
            const rotateY = (centerX - x) / 12;

            // Применяем трансформацию мгновенно для отклика
            card.style.transition = "transform 0.1s ease-out, box-shadow 0.4s ease";
            card.style.transform = `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
            card.style.animation = "none"; // Останавливаем фоновую левитацию
        });

        card.addEventListener("mouseleave", () => {
            // Возвращаем в исходное состояние плавно
            card.style.transition = "transform 0.7s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.4s ease";
            card.style.transform = `perspective(1200px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
            
            // Запускаем анимацию левитации обратно после завершения возврата
            setTimeout(() => {
                if (!card.matches(':hover')) {
                    card.style.animation = "cardFloat 6s infinite ease-in-out";
                }
            }, 700);
        });
    </script>
</body>
</html>
</html>
