<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Inter,sans-serif; }

body {
    background:#050505;
    overflow:hidden;
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    transition: background 0.6s;
}

/* Главная страница */
.main {
    width:580px;
    padding:65px 55px;
    background:rgba(20,20,28,0.78);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:36px;
    backdrop-filter:blur(28px);
    box-shadow:0 30px 70px rgba(0,0,0,0.65);
    transform-style:preserve-3d;
    position:relative;
    overflow:hidden;
}

.main::before {
    content:'';
    position:absolute;
    inset:-50%;
    background:radial-gradient(circle at 50% 25%, rgba(255,255,255,0.25) 0%, transparent 60%);
    opacity:0.65;
    pointer-events:none;
}
.main:hover::before { opacity:0.9; }

.avatar {
    width:152px;
    height:152px;
    border-radius:50%;
    background: url('https://raw.githubusercontent.com/kirill-boopil/FWJSlaASDWDboopil.github.io/main/images/avatar.png') center/cover;
    margin:0 auto 40px;
    border:5px solid rgba(255,255,255,0.18);
    box-shadow:0 15px 45px rgba(0,0,0,0.5);
}

/* Вторая страница */
.second {
    width:100vw;
    height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    gap:30px;
}

.second .big-avatar {
    width:280px;
    height:280px;
    border-radius:50%;
    background: url('https://raw.githubusercontent.com/kirill-boopil/FWJSlaASDWDboopil.github.io/main/images/avatar.png') center/cover;
    border:8px solid rgba(255,255,255,0.15);
    box-shadow:0 0 80px rgba(255,255,255,0.2);
}

.second h1 {
    font-size:42px;
    opacity:0.9;
}

/* Скрытие/показ */
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- Главная страница -->
<div class="main" id="mainPage">
    <div class="avatar"></div>
    <h1>Kirill</h1>
    
    <div class="links" style="display:flex; flex-direction:column; gap:17px; margin-top:20px;">
        <a href="https://github.com/kirill-boopil" target="_blank" style="text-decoration:none;color:white;background:rgba(255,255,255,0.06);padding:19px 26px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,0.1);font-size:17.5px;">GitHub <span>→</span></a>
        <a href="#" style="text-decoration:none;color:white;background:rgba(255,255,255,0.06);padding:19px 26px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,0.1);font-size:17.5px;">Telegram <span>→</span></a>
        <a href="#" style="text-decoration:none;color:white;background:rgba(255,255,255,0.06);padding:19px 26px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,0.1);font-size:17.5px;">Discord <span>→</span></a>
    </div>
</div>

<!-- Вторая страница -->
<div class="second hidden" id="secondPage">
    <div class="big-avatar"></div>
    <h1>Kirill</h1>
</div>

<script>
// Переключение страниц стрелками
document.addEventListener('keydown', (e) => {
    const main = document.getElementById('mainPage');
    const second = document.getElementById('secondPage');

    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        main.classList.add('hidden');
        second.classList.remove('hidden');
    } 
    else if (e.key === 'ArrowUp') {
        main.classList.remove('hidden');
        second.classList.add('hidden');
    }
});

// Фон с частицами
const canvas = document.createElement('canvas');
canvas.style.position = 'fixed';
canvas.style.left = '0';
canvas.style.top = '0';
canvas.style.width = '100%';
canvas.style.height = '100%';
canvas.style.zIndex = '-2';
document.body.appendChild(canvas);

const ctx = canvas.getContext('2d');
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let particles = [];
for(let i = 0; i < 180; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2.6,
        dx: (Math.random() - 0.5) * 0.5,
        dy: (Math.random() - 0.5) * 0.5
    });
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(200,220,255,0.85)";
    particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        p.x += p.dx;
        p.y += p.dy;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
    });
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
